# KataGo 엔진이 logDir(configs/*.cfg)에 남기는 로그 자동 정리.
# 재시작마다 워커 수만큼 파일이 새로 생기고 자동 삭제가 없어
# scripts/clean_logs.sh 수동 실행에 의존하던 것을 systemd-tmpfiles에 맡긴다.
#
# 내용은 config dump + 엔진 기동 로그뿐이라(logAllRequests/logSearchInfo 모두 off)
# 운영 진단 가치가 거의 없고, 같은 정보는 configs/*.cfg와 journald에 이미 있다.
# 다만 KataGo는 logDir이 없으면 기동하지 않으므로 디렉터리 자체는 유지한다('d' 타입).
#
# /etc/tmpfiles.d/katago-server.conf 로 심볼릭 링크해서 사용한다.
# 평소 정리는 systemd-tmpfiles-clean.timer가 매일 자동으로 수행한다.
#
# 규칙 인식 확인:
#   systemd-tmpfiles --tldr | grep analysis_logs
# 즉시 정리(이 규칙만 실행 — --prefix 없이 --clean 하면 시스템 전체 규칙이 돈다):
#   sudo systemd-tmpfiles --clean --prefix=/home/jisupark/Documents/project/doda/katago-server/analysis_logs
d /home/jisupark/Documents/project/doda/katago-server/analysis_logs 0755 jisupark jisupark 7d
